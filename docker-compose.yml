services:
  postgres:
    image: postgres:17
    container_name: order-processing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: order_app
      POSTGRES_PASSWORD: order_app_dev
      POSTGRES_DB: order_processing

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_app -d order_processing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: